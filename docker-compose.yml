# ROACH Application Services

services:
  weatherlink-ingest-to-kafka:
    build:
      context: ./services
      dockerfile: weatherlink-ingest-to-kafka/Dockerfile
    container_name: roach-weatherlink-ingest-to-kafka
    restart: unless-stopped
    environment:
      - WEATHERLINK_API_KEY=${WEATHERLINK_API_KEY}
      - WEATHERLINK_API_SECRET=${WEATHERLINK_API_SECRET}
      - WEATHERLINK_STATION_ID=${WEATHERLINK_STATION_ID}
      - KAFKA_BROKER=kafka:29092
      - POSTGRES_DSN=host=postgres port=5432 user=roach password=${POSTGRES_PASSWORD} dbname=roach sslmode=disable
      - FETCH_INTERVAL=5m
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - roach-network
    healthcheck:
      test: pgrep -f weather-service || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  weatherlink-materialize-to-sql:
    build:
      context: ./services/weatherlink-materialize-to-sql
      dockerfile: Dockerfile
    container_name: roach-weatherlink-materialize-to-sql
    restart: unless-stopped
    environment:
      - KAFKA_BROKER=kafka:29092
      - POSTGRES_DSN=host=postgres port=5432 user=roach password=${POSTGRES_PASSWORD} dbname=roach sslmode=disable
      - LOG_LEVEL=info
      - BATCH_SIZE=100
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - roach-network
    healthcheck:
      test: pgrep -f weather-sql || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  weatherlink-backfill-to-kafka:
    build:
      context: ./services
      dockerfile: weatherlink-backfill-to-kafka/Dockerfile
    container_name: roach-weatherlink-backfill-to-kafka
    environment:
      - WEATHERLINK_API_KEY=${WEATHERLINK_API_KEY}
      - WEATHERLINK_API_SECRET=${WEATHERLINK_API_SECRET}
      - WEATHERLINK_STATION_ID=${WEATHERLINK_STATION_ID}
      - KAFKA_BROKER=kafka:29092
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - roach-network
    profiles:
      - tools  # Only start when explicitly requested

  weatherlink-backfill-to-sql:
    build:
      context: ./services/weatherlink-backfill-to-sql
      dockerfile: Dockerfile
    container_name: roach-weatherlink-backfill-to-sql
    environment:
      - KAFKA_BROKER=kafka:29092
      - POSTGRES_DSN=host=postgres port=5432 user=roach password=${POSTGRES_PASSWORD} dbname=roach sslmode=disable
      - WORKER_POOL_SIZE=8
      - BATCH_SIZE=500
      - BATCH_FLUSH_INTERVAL_MS=1000
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - roach-network
    profiles:
      - tools  # Only start when explicitly requested

# Use the shared network
# Note: When running with -f docker-compose.infrastructure.yml -f docker-compose.yml,
# the network is created by infrastructure file. When running services alone,
# make sure infrastructure is running first.
networks:
  roach-network:
    name: roach-network
