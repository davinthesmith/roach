# ROACH Application Services

services:
  weatherlink-kafka:
    build:
      context: ./services
      dockerfile: weatherlink-kafka/Dockerfile
    container_name: roach-weatherlink-kafka
    restart: unless-stopped
    environment:
      - WEATHERLINK_API_KEY=${WEATHERLINK_API_KEY}
      - WEATHERLINK_API_SECRET=${WEATHERLINK_API_SECRET}
      - WEATHERLINK_STATION_ID=${WEATHERLINK_STATION_ID}
      - KAFKA_BROKER=kafka:29092
      - POSTGRES_DSN=host=postgres port=5432 user=roach password=${POSTGRES_PASSWORD} dbname=roach sslmode=disable
      - FETCH_INTERVAL=1m
      - METADATA_FETCH_INTERVAL=168h # 7 days
      - LOG_LEVEL=info
      - KAFKA_BACKFILL_ENABLED=${KAFKA_BACKFILL_ENABLED}
      - BACKFILL_REQUEST_PER_SECOND=8
      - BACKFILL_PARALLEL_WORKERS=4
      - BACKFILL_START_TS=1768061500
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - roach-network
    healthcheck:
      test: pgrep -f weather-service || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  weatherlink-sql:
    build:
      context: ./services/weatherlink-sql
      dockerfile: Dockerfile
    container_name: roach-weatherlink-sql
    restart: unless-stopped
    environment:
      - KAFKA_BROKER=kafka:29092
      - POSTGRES_DSN=host=postgres port=5432 user=roach password=${POSTGRES_PASSWORD} dbname=roach sslmode=disable
      - LOG_LEVEL=info
      - BATCH_SIZE=100
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - roach-network
    healthcheck:
      test: pgrep -f weather-sql || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  homeassistant-kafka:
    build:
      context: ./services
      dockerfile: homeassistant-kafka/Dockerfile
    container_name: roach-homeassistant-kafka
    restart: unless-stopped
    environment:
      - HA_URL=${HA_URL}
      - HA_WS_URL=${HA_WS_URL}
      - HA_TOKEN=${HA_TOKEN}
      - KAFKA_BROKER=kafka:29092
      - LOG_LEVEL=info
      - WS_RECONNECT_BACKOFF=1s,5s,30s
      - POLL_ENABLED=true
      - POLL_INTERVAL=5m
      - POLL_ENTITY_FILTER=${POLL_ENTITY_FILTER}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - roach-network
    healthcheck:
      test: pgrep -f homeassistant-kafka || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ubiquiti-kafka:
    build:
      context: ./services
      dockerfile: ubiquiti-kafka/Dockerfile
    container_name: roach-ubiquiti-kafka
    restart: unless-stopped
    environment:
      - UNIFI_API_KEY=${UNIFI_API_KEY}
      - UNIFI_HOST=${UNIFI_HOST}
      - KAFKA_BROKER=kafka:29092
      - LOG_LEVEL=info
      - RECONNECT_BACKOFF=1s,5s,30s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - roach-network
    healthcheck:
      test: pgrep -f ubiquiti-kafka || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  homeassistant-command:
    build:
      context: ./services
      dockerfile: homeassistant-command/Dockerfile
    container_name: roach-homeassistant-command
    restart: unless-stopped
    environment:
      - HA_URL=${HA_URL}
      - HA_WS_URL=${HA_WS_URL}
      - HA_TOKEN=${HA_TOKEN}
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=homeassistant.command
      - KAFKA_CONSUMER_GROUP=homeassistant-command
      - LOG_LEVEL=info
      - WS_RECONNECT_BACKOFF=1s,5s,30s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - roach-network
    healthcheck:
      test: pgrep -f homeassistant-command || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  weatherlink-kafka-backfill:
    build:
      context: ./services
      dockerfile: weatherlink-kafka-backfill/Dockerfile
    container_name: roach-weatherlink-kafka-backfill
    environment:
      - WEATHERLINK_API_KEY=${WEATHERLINK_API_KEY}
      - WEATHERLINK_API_SECRET=${WEATHERLINK_API_SECRET}
      - WEATHERLINK_STATION_ID=${WEATHERLINK_STATION_ID}
      - KAFKA_BROKER=kafka:29092
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - roach-network
    profiles:
      - tools  # Only start when explicitly requested

  weatherlink-sql-backfill:
    build:
      context: ./services/weatherlink-sql-backfill
      dockerfile: Dockerfile
    container_name: roach-weatherlink-sql-backfill
    environment:
      - KAFKA_BROKER=kafka:29092
      - POSTGRES_DSN=host=postgres port=5432 user=roach password=${POSTGRES_PASSWORD} dbname=roach sslmode=disable
      - WORKER_POOL_SIZE=8
      - BATCH_SIZE=500
      - BATCH_FLUSH_INTERVAL_MS=1000
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - roach-network
    profiles:
      - tools  # Only start when explicitly requested

# Use the shared network
# Note: When running with -f docker-compose.infrastructure.yml -f docker-compose.yml,
# the network is created by infrastructure file. When running services alone,
# make sure infrastructure is running first.
networks:
  roach-network:
    name: roach-network
